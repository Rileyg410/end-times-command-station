name: Siren relay

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to listen"
        default: "345"

permissions:
  contents: read
  actions: write

concurrency:
  group: sirens
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Listen for sirens
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FEED_TOPIC: etcs-sirens-live-q8v3n6
          RUN_MINUTES: ${{ github.event.inputs.minutes || '345' }}
        run: python3 watcher/sirens.py
      - name: Hand off to the next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sirens.yml -R ${{ github.repository }} || true
